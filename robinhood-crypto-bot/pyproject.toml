[project]
name = "rhbot"
version = "0.1.0"
description = "Risk-managed crypto trading bot for the Robinhood Crypto Trading API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rhbot = "rhbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
